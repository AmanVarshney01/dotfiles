# ────────────────────────────────────────────────────────────
#  Hyprlock — Catppuccin theme
# ────────────────────────────────────────────────────────────

general {
    no_fade_in = false
    grace = 0
}

background {
    monitor =
    path = /home/aman/wallpapers
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(203, 166, 247) # Mauve
    inner_color = rgb(30, 30, 46) # Base
    font_color = rgb(205, 214, 244) # Text
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 15
    check_color = rgb(166, 227, 161) # Green
    fail_color = rgb(243, 139, 168) # Red
    fail_text = <i>Incorrect Password</i>
    fail_transition = 300

    position = 0, 0
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hello, Aman
    color = rgba(205, 214, 244, 1.0) # Text
    font_size = 20
    font_family = CaskaydiaMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

