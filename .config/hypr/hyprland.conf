# Hyprland configuration
# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

source = ~/.config/hypr/monitors.conf

$terminal       = ghostty
$fileManager    = nautilus --new-window
$browser        = google-chrome-stable --new-window --ozone-platform=wayland
# $music          = class:chrome-music.youtube.com__-Default
#$passwordManager= 1password
#$messenger      = signal-desktop
$webapp         = chromium --app

#exec-once = ~/.config/hyprland/startup.sh
#env = XDG_SESSION_TYPE, x11

# Cursor size
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Force all apps to use Wayland
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_STYLE_OVERRIDE,kvantum
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland

# Make Chromium use XCompose and all Wayland
env = CHROMIUM_FLAGS,"--enable-features=UseOzonePlatform --ozone-platform=wayland --gtk-version=4"

# Make .desktop files available for wofi
env = XDG_DATA_DIRS,/usr/share:/usr/local/share:~/.local/share

# Use custom XCompose file
env = XCOMPOSEFILE,~/.XCompose

# Extra env variables
env = GDK_SCALE,2 # Change to 1 if on a 1x display
# Uncomment if running NVIDIA GPU
# env = NVD_BACKEND,direct
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia

ecosystem {
  no_update_news = true
}

exec-once = dbus-update-activation-environment --all
exec-once = gnome-keyring-daemon --start --components=secrets
# exec-once = hypridle & mako & waybar & fcitx5
exec-once = hypridle & fcitx5
# exec-once = swaybg -i ~/.config/omarchy/current/background -m fill
exec-once = systemctl --user start hyprpolkitagent
# exec-once = wl-clip-persist --clipboard regular & clipse -listen
exec-once = hyprpaper
exec-once = ~/.config/hypr/wallpaper-slideshow.sh &
exec-once = /usr/bin/kwalletd6
exec-once = copyq --start-server
exec-once = hyprpanel

# Application launchers
bind = SUPER, return, exec, $terminal
bind = SUPER, B, exec, $browser
bind = SUPER, M, exec, $music
bind = SUPER, N, exec, $terminal -e nvim
bind = SUPER, T, exec, $terminal -e btop
bind = SUPER, D, exec, $terminal -e lazydocker
bind = SUPER, O, exec, obsidian -disable-gpu
bind = SUPER, space, exec, wofi --show drun --sort-order=alphabetical

# Window/session management
bind = SUPER, W, killactive,
bind = SUPER, ESCAPE, exec, hyprlock
bind = SUPER SHIFT, ESCAPE, exec, systemctl suspend
bind = SUPER ALT, ESCAPE, exit,
bind = SUPER CTRL, ESCAPE, exec, reboot
bind = SUPER SHIFT CTRL, ESCAPE, exec, systemctl poweroff

# Tiling controls
bind = SUPER, J, togglesplit, # dwindle
bind = SUPER, P, pseudo,      # dwindle
bind = SUPER, V, togglefloating,

# Focus movement
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

# Workspace switching
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Swap windows
bind = SUPER SHIFT, left,  swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up,    swapwindow, u
bind = SUPER SHIFT, down,  swapwindow, d

# Window resize
bind = SUPER, minus, resizeactive, -100 0
bind = SUPER, equal, resizeactive, 100 0
bind = SUPER SHIFT, minus, resizeactive, 0 -100
bind = SUPER SHIFT, equal, resizeactive, 0 100

# Workspace scrolling (mouse)
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

# Move/resize via mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Multimedia & laptop special keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp,  exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown,exec, brightnessctl -e4 -n2 set 5%-

# Apple display brightness
bind = CTRL, F1, exec, ~/.local/share/omarchy/bin/apple-display-brightness -5000
bind = CTRL, F2, exec, ~/.local/share/omarchy/bin/apple-display-brightness +5000
bind = SHIFT CTRL, F2, exec, ~/.local/share/omarchy/bin/apple-display-brightness +60000

# Media keys (playerctl)
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

# Screenshots & picker
bind = , PRINT,        exec, hyprshot -m region
bind = SHIFT, PRINT,   exec, hyprshot -m window
bind = CTRL, PRINT,    exec, hyprshot -m output
bind = SUPER, PRINT,   exec, hyprpicker -a

# Wallpaper controls
bind = SUPER SHIFT, W, exec, hyprctl hyprpaper reload ",$(find ~/wallpapers -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.bmp' \) | shuf -n 1)"

# Additional webapp bindings
bind = SUPER, A, exec, $webapp="https://chatgpt.com"
bind = SUPER SHIFT, A, exec, $webapp="https://grok.com"
bind = SUPER, Y, exec, $webapp="https://youtube.com/"
bind = SUPER SHIFT, G, exec, $webapp="https://web.whatsapp.com/"
bind = SUPER, X, exec, $webapp="https://x.com/"
bind = SUPER SHIFT, X, exec, $webapp="https://x.com/compose/post"
bind = SUPER, M, exec, $webapp="https://music.youtube.com/"

# CopyQ
bind = CTRL SUPER, V, exec, copyq show

# Workspace / fullscreen utilities
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER, S, movetoworkspace, +0
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER, S, movetoworkspace, special:magic
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER, K, exec, $fileManager
bind = SUPER, F, fullscreen, 1
bind = SUPER, TAB, workspace, previous

general {
    layout        = dwindle
    border_size   = 0
    gaps_in       = 0
    gaps_out      = 0

    # Colors
    col.active_border   = rgb(c6d0f5)
    col.inactive_border = rgba(595959aa)

    # Behaviour
    resize_on_border = false
    allow_tearing    = false
}

decoration {
    rounding = 0

    shadow {
        enabled      = false
        range        = 2
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled   = false
        size      = 3
        passes    = 1
        vibrancy  = 0.1696
    }

    active_opacity     = 1.0
    inactive_opacity   = 1.0
    fullscreen_opacity = 1.0
}

animations {
    enabled = yes,

    # Bezier curves - optimized for snappy, smooth animations
    bezier = instant,0.1,0,0.1,1
    bezier = snappy,0.25,0.1,0.25,1
    bezier = smooth,0.4,0,0.2,1
    bezier = quick,0.15,0,0.1,1
    bezier = linear,0,0,1,1

    animation = global,        1, 2,   smooth
    animation = border,        1, 1,   instant
    animation = windows,       1, 1.5, snappy
    animation = windowsIn,     1, 1.2, snappy, popin 95%
    animation = windowsOut,    1, 0.8, quick, popin 95%
    animation = fadeIn,        1, 1,   smooth
    animation = fadeOut,       1, 0.8, smooth
    animation = fade,          1, 1,   quick
    animation = layers,        1, 1.5, snappy
    animation = layersIn,      1, 1.2, snappy, fade
    animation = layersOut,     1, 0.8, quick, fade
    animation = fadeLayersIn,  1, 1,   smooth
    animation = fadeLayersOut, 1, 0.8, smooth
    animation = workspaces,    0, 0,   ease
}

dwindle {
    pseudotile    = true
    preserve_split= true
    force_split   = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
}

group {
    groupbar {
        enabled = false
    }
}

input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    # kb_options = compose:caps // i like caps lock as a caps lock
    kb_rules   =

    follow_mouse = 1
    sensitivity  = 0 # -1.0 - 1.0

    touchpad {
        natural_scroll = true
    }

    natural_scroll = true
}

gestures {
    workspace_swipe = true
}

xwayland {
  force_zero_scaling = true
}

# Window rules
windowrule = suppressevent maximize, class:.*
windowrule = tile, class:^(Chromium)$
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = float, class:xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?)
windowrule = center, class:xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?)

# Layer rules
layerrule = blur,wofi

# Workspace window placement
windowrule = workspace 1, class:google-chrome
windowrule = workspace 1, class:zen
windowrule = workspace 2, class:cursor
windowrule = workspace 2, class:dev.zed.Zed
windowrule = workspace 3, class:com.mitchellh.ghostty
windowrule = workspace 4, initialTitle:x.com_/
windowrule = workspace 5, initialTitle:music.youtube.com_/
windowrule = workspace 6, class:discord
windowrule = workspace 7, class:Brave-browser

binds {
  allow_workspace_cycles = true
}

bind = SUPER, G, togglegroup
bind = ALT, TAB, changegroupactive, b

windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = size 400 225, title:^(Picture-in-Picture)$
windowrule = scrolltouchpad 1.5, class:com.mitchellh.ghostty
